name: Build Cython Blender Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

env:
  # Blender 5.1.2 uses Python 3.13
  PYTHON_VERSION: "3.13"
  BLENDER_VERSION: "5.1.2"

jobs:
  build-linux:
    name: Build Wheel (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build manylinux wheel on Linux
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp313-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
        with:
          package-dir: ./softwrap_core
          output-dir: dist_wheels

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist_wheels/*.whl

  build-windows:
    name: Build Wheel (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython setuptools wheel

      - name: Build Cython wheel
        run: |
          pip wheel ./softwrap_core --no-deps -w dist_wheels/

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist_wheels/*.whl

  build-macos:
    name: Build Wheel (macos-15)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython setuptools wheel

      - name: Build Cython wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          pip wheel ./softwrap_core --no-deps -w dist_wheels/

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist_wheels/*.whl

  package-extension:
    name: Package Blender Extension
    needs: [build-linux, build-windows, build-macos]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxrender1 libxkbcommon0 libgl1 libsm6 libice6

      - name: Set up Blender ${{ env.BLENDER_VERSION }}
        uses: bradyajohnston/setup-blender@v5
        with:
          version: ${{ env.BLENDER_VERSION }}

      - name: Download compiled wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: ./extension/wheels
          merge-multiple: true

      - name: Dynamically filter blender_manifest.toml if macOS failed
        if: needs.build-macos.result != 'success'
        run: |
          python3 -c '
          with open("./extension/blender_manifest.toml", "r") as f:
              lines = f.readlines()
          with open("./extension/blender_manifest.toml", "w") as f:
              for line in lines:
                  if "macosx" not in line and "macos-arm64" not in line:
                      f.write(line)
          '

      - name: Build split-platform extensions
        run: |
          mkdir -p release_zips
          blender --command extension build \
            --source-dir ./extension \
            --output-dir ./release_zips \
            --split-platforms

      - name: Upload final extension archives
        uses: actions/upload-artifact@v4
        with:
          name: blender-extension-zips
          path: release_zips/*.zip

      - name: Generate release body.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINUX_STATUS: ${{ needs.build-linux.result }}
          WINDOWS_STATUS: ${{ needs.build-windows.result }}
          MACOS_STATUS: ${{ needs.build-macos.result }}
        run: |
          cat << 'EOF' > body.md
          ## Softwrap Release (${{ github.ref_name }})

          Built and packaged with **Blender \(${{ env.BLENDER_VERSION }}** (Python\)${{ env.PYTHON_VERSION }}).

          ### Included Platform Builds
          * **Linux (`linux-x64`):** `${LINUX_STATUS}` (manylinux_2_28)
          * **Windows (`windows-x64`):** `${WINDOWS_STATUS}`
          * **macOS (`macos-arm64`):** `${MACOS_STATUS}`

          ### Installation
          1. Download the `.zip` archive matching your operating system below.
          2. Open Blender **${{ env.BLENDER_VERSION }}+** and go to **Edit > Preferences > Get Extensions**.
          3. Click the top-right dropdown menu and select **Install from Disk...**, then choose the downloaded `.zip` file.

          ### SHA-256 Checksums
          ```text
          EOF

          # Expand status variables and append actual file hashes
          envsubst < body.md > body.tmp && mv body.tmp body.md
          (cd release_zips && sha256sum *.zip) >> body.md
          echo '```' >> body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          generate_release_notes: true
          files: release_zips/*.zip
